# DeterminateSystems/magic-nix-cache-action: one GitHub cache entry per
# store path, skipping paths on cache.nixos.org. Subject to GitHub's 200
# uploads/min limit (HTTP 418/429, logged but not fatal). It doesn't
# upload the babashka outputs (results/2026-10-13-clj-nix), so it doesn't
# converge on that workload.
#@section permissions
#@section env
#@section steps
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
          diagnostic-endpoint: ""
#@section post-steps
